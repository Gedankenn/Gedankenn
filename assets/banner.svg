    <circle cx="680" cy="64" r="3.5" fill="none" stroke="#ff2daa" stroke-opacity="0.6"/>
  </g>

  <!-- status line top-left -->
  <g font-family="monospace" font-size="13" fill="#8a8aa8">
    <text x="34" y="26">fabio@embedded:~$ whoami</text>
    <text x="34" y="44" fill="#00f0ff">fabio · R&amp;D firmware engineer</text>
    <text x="34" y="62" fill="#8a8aa8">loc: pato branco, BR</text>
  </g>

  <!-- status line top-right -->
  <g font-family="monospace" font-size="13">
    <text x="930" y="26" text-anchor="end" fill="#8a8aa8">[ sys ]</text>
    <text x="930" y="44" text-anchor="end" fill="#8a8aa8">os: linux</text>
    <text x="930" y="62" text-anchor="end" fill="#8a8aa8">uid: <tspan fill="#ff2daa">0</tspan></text>
  </g>

  <!-- title: chromatic aberration layers -->
  <text x="482" y="150" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" letter-spacing="10" fill="#ff2daa" fill-opacity="0.35">GEDANKENN</text>
  <text x="478" y="150" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" letter-spacing="10" fill="#8b5cf6" fill-opacity="0.4">GEDANKENN</text>
  <text x="480" y="150" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" letter-spacing="10" fill="#00f0ff">GEDANKENN</text>

  <text x="482" y="150" text-anchor="middle" font-family="monospace" font-size="66" font-weight="bold" letter-spacing="10" fill="none" stroke="#00f0ff" stroke-opacity="0.25">GEDANKENN</text>

